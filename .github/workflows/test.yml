name: EdgeAI tests

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Build deterministic demo dataset
        run: node build-data.js --demo
      - name: Validate generated data contract
        run: npm run verify:data

  live-smoke:
    # Provider lag is an operational condition, not a PR code regression.
    # Only explicitly requested live checks should depend on Yahoo being current.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build from live Yahoo market data
        run: node build-data.js
      - name: Validate live output contract
        run: npm run verify:data
