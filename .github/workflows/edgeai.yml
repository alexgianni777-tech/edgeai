name: EdgeAI daily

# Kör gratis på GitHubs servrar — de når Yahoo (till skillnad från Claudes sandlåda).
on:
  push:
    branches: ["main"]
    paths:
      - "build-data.js"
      - "data-live.js"
      - "data-freshness.js"
      - "indicators.js"
      - "metrics.js"
      - "montecarlo.js"
      - "portfolio-risk.js"
      - "proposal-params.js"
      - "screener.js"
      - "strategy*.js"
      - "universe-validation.js"
      - "validate-output.js"
      - "package.json"
      - "notify.js"
      - "telegram-health.js"
      - "publication-policy.js"
      - "prepare-pages.js"
      - "report-market-status.js"
      - ".github/workflows/edgeai.yml"
  schedule:
    # Three starts, as before. 23:17 UTC is after both publication cutoffs
    # (19:00 Stockholm / 17:30 New York) in winter AND summer.
    # Morning starts retry delayed provider data; GitHub can delay any cron.
    - cron: "47 23 * * 1-5"
    - cron: "17 6 * * 1-5"
    - cron: "37 9 * * 1-5"
    - cron: "37 12 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: edgeai-daily
  cancel-in-progress: false

permissions:
  contents: write            # commit public/data.json
  pages: write               # deploy the freshly generated dataset
  id-token: write            # required by deploy-pages

jobs:
  run:
    # A manual dispatch on a review branch must never publish or update data.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: edgeai-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Run regression tests
        run: npm test

      # 1) Bygg hemsidans data (USA + Sverige) och committa den
      - name: Build site data (US + SE)
        run: node build-data.js
      - name: Validate output contract
        run: npm run verify:data
      - name: Write per-market delivery status
        run: node report-market-status.js
      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A public/
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git push

      # GITHUB_TOKEN pushes do not trigger another Actions workflow. Deploy
      # the exact working tree we just generated so Pages and Replit see the
      # same fresh data immediately.
      - name: Stage safe static Pages output
        run: node prepare-pages.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy fresh EdgeAI data to Pages
        id: deployment
        uses: actions/deploy-pages@v5


      # Code pushes validate connection without sending an unsolicited digest.
      # Scheduled runs send the regular report after a verified build.
      - name: Probe EdgeAI Telegram bot and recipient (no message)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-health.js

      # Never send an older watchlist if the build was blocked by stale Yahoo prices.
      # The Telegram receipt is recorded by notify.js only after Telegram confirms delivery.
      - name: Send verified EdgeAI Telegram digest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node notify.js

      # One informative status notification on the first morning refresh failure.
      # This is NOT a trading list and must never be mistaken for one.
      - name: Warn once when morning EdgeAI data is unavailable
        if: ${{ failure() && github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1-5' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node alert-stale.js

      # A successfully delivered US-only snapshot is valuable, but a missing
      # Swedish close must NEVER leave a false green operational check.
      - name: Mark partial publication as degraded
        if: success()
        run: node report-market-status.js --strict
