name: EdgeAI daily

# Kör gratis på GitHubs servrar — de når Yahoo (till skillnad från Claudes sandlåda).
on:
  push:
    branches: ["main"]
    paths:
      - "build-data.js"
      - "data-live.js"
      - "indicators.js"
      - "metrics.js"
      - "montecarlo.js"
      - "portfolio-risk.js"
      - "proposal-params.js"
      - "screener.js"
      - "strategy*.js"
      - "universe-validation.js"
      - "validate-output.js"
      - "package.json"
      - ".github/workflows/edgeai.yml"
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC vardagar = 08:00 svensk sommartid
    - cron: "37 9,12 * * 1-5" # UTC-reservstarter om GitHub försenar/tappar morgonjobbet
  workflow_dispatch: {}

concurrency:
  group: edgeai-daily
  cancel-in-progress: false

permissions:
  contents: write            # commit public/data.json
  pages: write               # deploy the freshly generated dataset
  id-token: write            # required by deploy-pages

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Run regression tests
        run: npm test

      # 1) Bygg hemsidans data (USA + Sverige) och committa den
      - name: Build site data (US + SE)
        run: node build-data.js
      - name: Validate output contract
        run: npm run verify:data
      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A public/
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git push

      # GITHUB_TOKEN pushes do not trigger another Actions workflow. Deploy
      # the exact working tree we just generated so Pages and Replit see the
      # same fresh data immediately.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy fresh EdgeAI data to Pages
        id: deployment
        uses: actions/deploy-pages@v5

