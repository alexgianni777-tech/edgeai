name: EdgeAI daily

# Kör gratis på GitHubs servrar — de når Yahoo (till skillnad från Claudes sandlåda).
on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC vardagar = 08:00 svensk sommartid
    - cron: "37 9,12 * * 1-5" # UTC-reservstarter om GitHub försenar/tappar morgonjobbet
  workflow_dispatch: {}

concurrency:
  group: edgeai-daily
  cancel-in-progress: false

permissions:
  contents: write            # behövs för att committa data.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Run regression tests
        run: npm test

      # 1) Bygg hemsidans data (USA + Sverige) och committa den
      - name: Build site data (US + SE)
        run: node build-data.js
      - name: Validate output contract
        run: npm run verify:data
      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A public/
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git push

