name: Refresh EdgeAI Yahoo data
on:
  workflow_dispatch:
  # Manual fallback only. EdgeAI daily owns automatic refresh and Telegram.
  # Running two full-market Yahoo builds overnight amplified provider lag.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: edgeai-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: edgeai-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies (repository has no lockfile)
        run: npm install --no-package-lock --ignore-scripts
      - name: Fetch Yahoo and rebuild SE/US
        run: npm run build
      - name: Validate importer contract
        run: npm run verify:data
      - name: Report independent market source dates
        run: node report-market-status.js
      - name: Commit fresh data only on successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh verified SE and US Yahoo sessions"
            git push
          fi

      - name: Stage safe Pages output
        run: node prepare-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified or explicitly stale per-market data
        uses: actions/deploy-pages@v5
      - name: Mark incomplete manual refresh as degraded
        run: node report-market-status.js --strict
